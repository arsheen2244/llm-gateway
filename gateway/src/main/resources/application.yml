spring:
  application:
    name: llm-gateway
  data:
    redis:
      # Only used when gateway.rate-limit.backend=redis.
      url: ${REDIS_URL:redis://localhost:6379}
      # Short, so a slow or dead Redis can't add much latency to requests (design note 20).
      timeout: 100ms
      connect-timeout: 200ms
  threads:
    virtual:
      # Each request runs on a virtual thread, so blocking code (waiting on the
      # provider, writing SSE frames) is cheap even with thousands of open streams.
      enabled: true

server:
  port: 8080

logging:
  structured:
    format:
      # One JSON object per log line (Elastic Common Schema), built into Spring Boot.
      # MDC fields (requestId, model, provider...) become JSON fields, so logs can be
      # filtered by request ID without regex. Override with LOGGING_STRUCTURED_FORMAT_CONSOLE=
      # (empty) for plain-text logs while developing.
      console: ecs

gateway:
  # Provider instances. "type" picks the adapter (the protocol); the rest says
  # where this instance lives. API keys come only from environment variables.
  providers:
    openai:
      type: openai
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      type: anthropic
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY:}
    mock-openai:
      type: openai
      base-url: ${MOCK_PROVIDER_URL:http://localhost:8081}
      api-key: mock-key   # not a secret: the mock only checks that a key is present
    mock-anthropic:
      type: anthropic
      base-url: ${MOCK_PROVIDER_URL:http://localhost:8081}
      api-key: mock-key

  # Ordered rules, first match wins. A trailing * matches any suffix.
  # Specific patterns must come before general ones ("mock-claude-*" before "mock-*").
  routes:
    - model-pattern: "mock-claude-*"
      provider: mock-anthropic
    - model-pattern: "mock-*"
      provider: mock-openai
    - model-pattern: "gpt-*"
      provider: openai
    - model-pattern: "claude-*"
      provider: anthropic

  timeouts:
    connect: 5s
    read: 60s

  # Per-client limits come from gateway.auth.clients (design notes 18-19).
  rate-limit:
    enabled: true
    backend: in-memory          # 'redis' to share windows across instances
    window: 1m
    # Completion tokens reserved when a request sets no max_tokens (reconciled afterwards).
    default-completion-tokens: 1000
    # While Redis is unreachable, each instance enforces 1/instances of every limit,
    # and tries Redis again at this interval (design note 22).
    instances: 1
    redis-retry-interval: 5s
