spring:
  application:
    name: llm-gateway
  data:
    redis:
      # Only used when gateway.rate-limit.backend=redis.
      url: ${REDIS_URL:redis://localhost:6379}
      # Short, so a slow or dead Redis can't add much latency to requests (design note 20).
      timeout: 100ms
      connect-timeout: 200ms
  threads:
    virtual:
      # Each request runs on a virtual thread, so blocking code (waiting on the
      # provider, writing SSE frames) is cheap even with thousands of open streams.
      enabled: true

server:
  port: 8080

logging:
  structured:
    format:
      # One JSON object per log line (Elastic Common Schema), built into Spring Boot.
      # MDC fields (requestId, model, provider...) become JSON fields, so logs can be
      # filtered by request ID without regex. Override with LOGGING_STRUCTURED_FORMAT_CONSOLE=
      # (empty) for plain-text logs while developing.
      console: ecs

# Metrics only, on a separate port, so the public port (and nginx) never serves them
# (design note 42).
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: prometheus

gateway:
  # Provider instances. "type" picks the adapter (the protocol); the rest says
  # where this instance lives. API keys come only from environment variables.
  providers:
    openai:
      type: openai
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      type: anthropic
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY:}
    mock-openai:
      type: openai
      base-url: ${MOCK_PROVIDER_URL:http://localhost:8081}
      api-key: mock-key   # not a secret: the mock only checks that a key is present
    mock-anthropic:
      type: anthropic
      base-url: ${MOCK_PROVIDER_URL:http://localhost:8081}
      api-key: mock-key

  # Ordered rules, first match wins. A trailing * matches any suffix.
  # Specific patterns must come before general ones ("mock-claude-*" before "mock-*").
  routes:
    - model-pattern: "mock-claude-*"
      provider: mock-anthropic
    - model-pattern: "mock-*"
      provider: mock-openai
    - model-pattern: "gpt-*"
      provider: openai
    - model-pattern: "claude-*"
      provider: anthropic

  timeouts:
    connect: 5s
    read: 60s

  # Failover, retries and circuit breakers (design notes 27-28).
  resilience:
    max-attempts-per-provider: 2   # 1 retry, then the next provider in the route
    backoff-base: 100ms            # full jitter: wait random(0, min(cap, base x 2^retry))
    backoff-cap: 2s
    retry-budget-ratio: 0.1        # retries add at most 10% of recent requests...
    retry-budget-min-per-second: 1 # ...plus 1/s, so quiet providers can still retry
    retry-budget-window: 10s
    breaker:
      failure-rate-threshold: 0.5
      minimum-calls: 20
      window: 30s
      open-duration: 30s
      half-open-trial-calls: 3
    # Hedged requests for non-streaming calls (design note 30).
    hedging:
      enabled: true
      percentile: 0.95      # hedge after the recent p95 latency...
      floor: 300ms          # ...but never sooner than this
      default-delay: 2s     # until min-samples successful calls are known
      min-samples: 20
      sample-window: 200
      max-ratio: 0.05       # hedges for at most 5% of requests

  # Response cache (design notes 32-36).
  cache:
    enabled: true
    store: in-memory          # 'redis' to share one cache across instances
    ttl: 1h
    max-temperature: 0.3      # only requests that explicitly set temperature <= this
    # Meaning-based matching. Off: in the evaluation no threshold kept wrong answers out
    # (design note 36, results/cache-threshold/).
    semantic-enabled: false
    similarity-threshold: 0.95
    embedding:                # local text-embeddings-inference service (design note 34)
      url: ${GATEWAY_CACHE_EMBEDDING_URL:http://localhost:8082}
      timeout: 500ms
      dimensions: 384         # BAAI/bge-small-en-v1.5

  # One usage event per request, for accounting (design notes 37-38).
  usage:
    enabled: true
    sink: log                   # 'kafka' to send events to Kafka (Docker Compose does)
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      topic: usage-events
      queue-capacity: 100000    # events held in memory while Kafka is down; then dropped
      delivery-timeout: 2m      # one send's time limit before the event is queued again
      shutdown-timeout: 5s      # time to send what's still queued when stopping
    report:                     # GET /v1/usage (design note 40); no URL: it answers 503
      url: ${USAGE_DB_URL:}
      username: ${USAGE_DB_READER_USER:usage_reader}
      password: ${USAGE_DB_READER_PASSWORD:}

  # Per-client limits come from gateway.auth.clients (design notes 18-19).
  rate-limit:
    enabled: true
    backend: in-memory          # 'redis' to share windows across instances
    window: 1m
    # Completion tokens reserved when a request sets no max_tokens (reconciled afterwards).
    default-completion-tokens: 1000
    # While Redis is unreachable, each instance enforces 1/instances of every limit,
    # and tries Redis again at this interval (design note 22).
    instances: 1
    redis-retry-interval: 5s
