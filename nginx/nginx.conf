# Load balancer in front of the three gateway instances (design note 23).

# One worker per CPU, each allowed many connections. The defaults (one worker, 512 connections,
# counting those to the gateways) made nginx itself refuse requests at about 1,000 per second:
# a 500 page or a closed connection, before any gateway saw them (design note 43).
worker_processes auto;
events {
    worker_connections 8192;
}

http {
    upstream gateways {
        # Round robin (nginx's default): each new request goes to the next instance.
        server gateway-1:8080;
        server gateway-2:8080;
        server gateway-3:8080;
        # Keep idle connections to the gateways open and reuse them, instead of a new
        # TCP connection for every request.
        keepalive 64;
        keepalive_requests 100000;   # don't close busy connections every 1,000 requests
    }

    server {
        listen 80;
        # nginx closes a client's keep-alive connection after this many requests. A client may
        # already be sending the next request on it, which then fails; the default (1,000) made
        # that happen several times a second under load.
        keepalive_requests 100000;

        location / {
            proxy_pass http://gateways;

            # HTTP/1.1 with an empty Connection header is what upstream keep-alive needs.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # Streaming (SSE): pass every chunk through immediately. With buffering on,
            # nginx would collect the stream and deliver it in lumps.
            proxy_buffering off;
            proxy_cache off;
            # LLM streams can run for minutes; only cut off a connection that is silent.
            proxy_read_timeout 300s;

            # Which instance answered. Lets the smoke test prove traffic is spread out.
            # (Exposes internal addresses: fine for this demo, remove in production.)
            add_header X-Upstream $upstream_addr always;
        }
        # Note: nginx does not retry POST requests on another instance by default
        # (proxy_next_upstream excludes non-idempotent requests), so a provider call is
        # never silently sent twice. Retrying is week 3's decision.
    }
}
