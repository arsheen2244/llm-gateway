spring:
  application:
    name: usage-consumer
  main:
    web-application-type: none
    keep-alive: true          # no web server to keep the JVM running

  datasource:
    url: ${USAGE_DB_URL:jdbc:postgresql://localhost:5432/usage}
    username: ${USAGE_DB_USER:usage}
    password: ${USAGE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000  # ms (Hikari takes a plain number)
      data-source-properties:
        # Seconds. A PostgreSQL that hangs fails the write instead of blocking forever; the
        # event is then retried (design note 39).
        socketTimeout: 10
        connectTimeout: 5

  flyway:
    connect-retries: 30       # PostgreSQL may still be starting

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: usage-consumer
      # A new group starts at the oldest event; the default (latest) would skip events sent
      # before the consumer first ran.
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record        # commit an event's offset only after its database commit
      concurrency: 3          # one thread per partition
    producer:
      acks: all               # the dead-letter topic

usage:
  topic: usage-events
  dead-letter-topic: usage-events-dlt
  retry-interval: 1s          # wait between tries while PostgreSQL is unavailable
