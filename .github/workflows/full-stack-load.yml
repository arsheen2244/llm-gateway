name: Full-stack load test

# Week-5 benchmark (design note 43): the whole Compose stack with every feature on (3 gateways
# behind nginx, Redis rate limits and cache, usage events through Kafka to PostgreSQL, metrics),
# against the mock provider. Sustained request rate, and the latency the gateway adds.
on:
  workflow_dispatch:
    inputs:
      rates:
        description: Request rates to try, per second
        default: "100 200 400 600 800 1000 1200 1600 2000"
      max_in_flight:
        description: Requests in flight allowed per gateway before shedding (design note 45)
        default: "1000"
  # A "Run workflow" button only appears once this file is on main, so until then (and whenever
  # the measurement itself changes) a push also runs it.
  push:
    paths:
      - load-test/full-stack.js
      - load-test/full_stack.sh
      - load-test/full_stack_report.py
      - load-test/overload_snapshot.py
      - .github/workflows/full-stack-load.yml
      - nginx/nginx.conf

jobs:
  measure:
    # Three independent repetitions, each on its own runner: shared cloud machines vary (even
    # the CPU model), so one run proves little. Each result is published with its machine.
    name: run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: grafana/setup-k6-action@v1

      - name: The machine (published with the numbers)
        run: |
          mkdir -p load-test/results/full-stack
          { echo "runner: GitHub Actions ubuntu-latest"; nproc | sed 's/^/vCPUs: /';
            grep -m1 'model name' /proc/cpuinfo; free -g | awk '/Mem:/ {print "memory GB: " $2}';
            k6 version; docker --version; } | tee load-test/results/full-stack/machine.txt
          while read -r line; do echo "::notice title=machine::$line"; done < load-test/results/full-stack/machine.txt

      - name: Start the stack
        env:
          GATEWAY_OVERLOAD_MAX_IN_FLIGHT: ${{ github.event.inputs.max_in_flight || '1000' }}
        run: |
          docker compose build
          docker compose up -d

      - name: Wait until requests work and are recorded
        run: |
          bash scripts/smoke-test.sh http://localhost:8080
          bash scripts/check-usage.sh http://localhost:8080

      - name: Measure
        run: bash load-test/full_stack.sh ${{ github.event.inputs.rates || '100 200 400 600 800 1000 1200 1600 2000' }}

      - name: Report
        if: always()
        run: python3 load-test/full_stack_report.py | tee load-test/results/full-stack/report.md

      - name: Diagnose usage events (where each one went, restarts, errors)
        if: always()
        run: python3 scripts/diagnose_usage.py | tee load-test/results/full-stack/diagnosis.txt

      - name: Keep raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-load-${{ matrix.run }}
          path: load-test/results/full-stack

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100 gateway-1 usage-consumer

      - name: Stop stack
        if: always()
        run: docker compose down
