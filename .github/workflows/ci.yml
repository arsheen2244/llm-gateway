name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # "verify" compiles, runs unit + integration tests, and packages both apps.
      # Tests only talk to the mock provider, so no API keys are needed here.
      - name: Build and test
        run: ./mvnw -B verify
