name: CI

on:
  # Every branch, so work-in-progress branches get the Docker-only tests (Redis) too.
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # "verify" compiles, runs unit + integration tests, and packages both apps.
      # Tests only talk to the mock provider, so no API keys are needed here.
      - name: Build and test
        run: ./mvnw -B verify

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Smoke test through the gateway
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down
