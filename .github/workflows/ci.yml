name: CI

on:
  # Every branch, so work-in-progress branches get the Docker-only tests (Redis) too.
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # "verify" compiles, runs unit + integration tests, and packages both apps.
      # Tests only talk to the mock provider, so no API keys are needed here.
      - name: Build and test
        run: ./mvnw -B verify

      # The semantic-cache threshold sweep's own logic (eval/, design note 36).
      - name: Eval script tests
        run: python3 -m unittest discover eval

      # Raw logs and step summaries need a GitHub login; annotations do not. On failure,
      # turn each failing test into an annotation (test name + error line) so anyone
      # viewing the run can see what broke. GitHub shows up to 10 errors and 10 warnings
      # per step, so failures beyond the 10th become warnings.
      - name: Publish test failures as annotations
        if: failure()
        run: |
          # Skip each file's "Tests run: ... <<< FAILURE!" summary line; match the per-test
          # lines. The message that follows can span several lines (AssertJ puts
          # "expected / but was" on their own lines), so collect lines until the stack trace
          # ("\tat ...") starts, joined with %0A, which GitHub shows as a line break.
          awk '/<<< (FAILURE|ERROR)!/ && !/^Tests run:/ {
                 title = $1; msg = ""
                 for (i = 0; i < 8 && (getline line) > 0; i++) {
                   if (line ~ /^\tat /) break
                   gsub(/\r/, "", line); gsub(/%/, "%25", line)
                   msg = (msg == "") ? line : msg "%0A" line
                 }
                 level = (++n <= 10) ? "error" : "warning"
                 printf "::%s title=%s::%s\n", level, title, substr(msg, 1, 900)
               }' */target/surefire-reports/*.txt | head -n 20
          echo "Failing tests in total: $(grep -h -c -E '<<< (FAILURE|ERROR)!' */target/surefire-reports/*.txt | paste -sd+ | bc)"

      # Also public: did the Docker-only (Redis, Kafka, PostgreSQL) tests run, or were they
      # skipped? Plus the resilience tests, so their counts are visible without signing in.
      - name: Report Docker-only and resilience test counts
        if: always()
        run: |
          reports=gateway/target/surefire-reports
          for f in "$reports"/*Redis*.txt "$reports"/*TwoGateway*.txt "$reports"/*resilience*.txt \
              "$reports"/*Broker*.txt "$reports"/*JdbcUsageReader*.txt usage-consumer/target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            echo "::notice title=$(basename "$f" .txt)::$(grep -m1 'Tests run' "$f")"
          done

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      # The semantic profile adds the embedding service, checked below.
      - name: Start stack
        run: docker compose --profile semantic up -d

      - name: Smoke test through the gateway
        run: bash scripts/smoke-test.sh http://localhost:8080

      # Requests through nginx end up in PostgreSQL exactly once (design note 39).
      - name: Usage reaches PostgreSQL
        run: bash scripts/check-usage.sh http://localhost:8080

      # The model downloads on first start, so allow a few minutes.
      - name: Embedding service answers
        run: bash scripts/check-embeddings.sh http://localhost:8082

      # Embeds every labelled pair through the real service; prints no rates (design note 36).
      - name: Threshold sweep runs (check only)
        run: python3 eval/sweep_threshold.py --check-only

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose --profile semantic down
