# Three gateway instances behind nginx, sharing one Redis (rate limits, cache), plus the mock,
# Kafka, the usage consumer and PostgreSQL for usage accounting, and a local embedding service for the semantic cache.
#   docker compose up --build
# Entry point (nginx): http://localhost:8080      Mock (direct): http://localhost:8081
# Embeddings (direct): http://localhost:8082
# Grafana dashboard: http://localhost:3000      Prometheus: http://localhost:9090
#
# Rate-limit backend: RATE_LIMIT_BACKEND=redis (default, limits shared by all instances)
# or RATE_LIMIT_BACKEND=in-memory (each instance counts on its own; the week-2 baseline).
#
# Real-provider keys are optional and come from your shell or a git-ignored .env file.
# Without them, gpt-* and claude-* return 503 provider_not_configured; mock-* always works.

# Settings shared by the three gateway instances (a YAML anchor, reused below).
x-gateway: &gateway
  build:
    context: .
    dockerfile: gateway/Dockerfile
  image: llm-gateway/gateway:local
  # A gateway that exits (it does when out of heap) comes back on its own (design note 44).
  restart: unless-stopped
  environment:
    # Inside the Compose network, services reach each other by service name.
    MOCK_PROVIDER_URL: http://mock-provider:8081
    REDIS_URL: redis://redis:6379
    # Demo clients with public keys (gateway/src/main/resources/application-local.yml).
    SPRING_PROFILES_ACTIVE: local
    GATEWAY_RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
    # If Redis becomes unreachable, each instance enforces 1/3 of every limit (design note 22).
    GATEWAY_RATE_LIMIT_INSTANCES: "3"
    # One cache shared by all instances (design note 33).
    GATEWAY_CACHE_STORE: redis
    # The semantic cache layer is off by default (design note 36). To try it:
    #   GATEWAY_CACHE_SEMANTIC=true docker compose --profile semantic up
    GATEWAY_CACHE_SEMANTIC_ENABLED: ${GATEWAY_CACHE_SEMANTIC:-false}
    GATEWAY_CACHE_EMBEDDING_URL: http://embeddings:80
    # Usage events go to Kafka (design note 38). If Kafka is down, requests still succeed and
    # events wait in each instance's memory.
    GATEWAY_USAGE_SINK: kafka
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # GET /v1/usage reads daily totals with a role that can read only those (design note 40).
    # The gateways don't wait for PostgreSQL either.
    USAGE_DB_URL: jdbc:postgresql://postgres:5432/usage
    USAGE_DB_READER_PASSWORD: ${USAGE_DB_READER_PASSWORD:-local-only-reader}
    # Three JVMs on one machine: keep each heap modest.
    JAVA_TOOL_OPTIONS: -Xmx384m
    # Load shedding: at most this many requests in flight per instance (design note 45).
    GATEWAY_OVERLOAD_MAX_IN_FLIGHT: ${GATEWAY_OVERLOAD_MAX_IN_FLIGHT:-500}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  depends_on:
    redis:
      condition: service_healthy
    mock-provider:
      condition: service_started

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

  gateway-1: *gateway
  gateway-2: *gateway
  gateway-3: *gateway

  redis:
    # Redis 8: vector search is built in, for the semantic cache (design note 35).
    image: redis:8.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One Kafka broker in KRaft mode (no ZooKeeper), for usage events (design note 38).
  # The gateways don't wait for it: usage must never hold up requests.
  kafka:
    image: apache/kafka:3.9.1
    ports:
      # From the host: localhost:29092. Inside Compose: kafka:9092.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker: every internal topic has one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # usage-events is created on first use with 3 partitions (one per consumer, at most).
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Writes usage events from Kafka to PostgreSQL (design note 39).
  usage-consumer:
    build:
      context: .
      dockerfile: usage-consumer/Dockerfile
    image: llm-gateway/usage-consumer:local
    restart: unless-stopped   # design note 44
    environment:
      SPRING_PROFILES_ACTIVE: local   # made-up prices for the mock models
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USAGE_DB_URL: jdbc:postgresql://postgres:5432/usage
      USAGE_DB_USER: usage
      USAGE_DB_PASSWORD: ${USAGE_DB_PASSWORD:-local-only}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usage
      POSTGRES_USER: usage
      # Not secrets: the database is reachable only inside the Compose network. Set
      # USAGE_DB_PASSWORD and USAGE_DB_READER_PASSWORD anywhere else.
      POSTGRES_PASSWORD: ${USAGE_DB_PASSWORD:-local-only}
      USAGE_DB_READER_PASSWORD: ${USAGE_DB_READER_PASSWORD:-local-only-reader}
    volumes:
      - ./deploy/postgres/01-usage-reader.sh:/docker-entrypoint-initdb.d/01-usage-reader.sh:ro
      - usage-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U usage -d usage"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Collects metrics from each gateway directly (not through nginx) on their metrics port,
  # which is not published to the host (design note 42).
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anyone on this machine may look; changing anything needs the admin password.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only}
      GF_USERS_DEFAULT_THEME: dark   # the dashboard's colors are chosen for it
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/llm-gateway.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro

  # Hugging Face text-embeddings-inference on CPU with a small English model (384 dimensions).
  # Only for the (off by default) semantic cache layer and its evaluation, so it starts only
  # with --profile semantic or when named: docker compose up -d embeddings.
  # Runs locally, so tests and benchmarks cost nothing. The model (~130 MB) is downloaded on
  # first start and kept in a named volume.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    profiles: ["semantic"]
    ports:
      - "8082:80"
    volumes:
      - embedding-models:/data

  mock-provider:
    build:
      context: .
      dockerfile: mock-provider/Dockerfile
    # Named, so the extra mocks in docker-compose.resilience.yml can reuse the same image.
    image: llm-gateway/mock-provider:local
    ports:
      - "8081:8081"
    environment:
      # Override any of these from your shell, e.g. MOCK_ERROR_RATE=0.1 docker compose up
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-100}
      MOCK_CHUNK_COUNT: ${MOCK_CHUNK_COUNT:-10}
      MOCK_CHUNK_DELAY_MS: ${MOCK_CHUNK_DELAY_MS:-10}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0}
      MOCK_MID_STREAM_FAILURE_RATE: ${MOCK_MID_STREAM_FAILURE_RATE:-0}

volumes:
  usage-data:
  embedding-models:
